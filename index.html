<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>简易文档矫正</title>
<script src="https://cdn.jsdelivr.net/npm/opencv.js@4.7.0/opencv.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jscanify@1.2.0/dist/jscanify.min.js"></script>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{padding:20px;text-align:center}
#fileInput{margin:20px 0;padding:12px}
#result{margin-top:20px;max-width:100%;border:1px solid #ccc}
</style>
</head>
<body>
<h3>文档矫正（jscanify）</h3>
<input type="file" id="fileInput" accept="image/*">
<div id="tip">等待opencv加载……</div>
<img id="result">
<script>
let scanner = null;
cv['onRuntimeInitialized'] = ()=>{
    scanner = new jscanify();
    document.getElementById('tip').innerText = "✅加载完成，可以选择相册图片";
}
document.getElementById('fileInput').onchange = async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const img = new Image();
    img.src = URL.createObjectURL(file);
    img.onload = ()=>{
        const canvas = scanner.extractPaper(img, 700,1000);
        document.getElementById('result').src = canvas.toDataURL();
        document.getElementById('tip').innerText = "✅矫正完成，长按图片保存";
    }
}
</script>
</body>
</html>
